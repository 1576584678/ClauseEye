name: Build & Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: 构建 Windows 免安装版
    runs-on: windows-latest
    env:
      # electron-builder 需要下载 electron / nsis / winCodeSign，CI 直连 GitHub 即可
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      # fetch-depth: 0 —— 自动生成「本次更新」需要能读到上一个 tag 到当前 tag 的提交
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 缓存 electron / nsis / winCodeSign，避免重复下载造成的偶发失败
      - name: 缓存 electron-builder 工具链
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: eb-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 校验（类型检查 + 单测）
        run: |
          npm run typecheck
          npm test

      - name: 下载离线 OCR 语言包
        run: npm run tessdata
        continue-on-error: true

      - name: 生成图标
        run: npm run icon

      - name: 前端生产构建
        run: npm run build

      # 这里只构建、不发布：产物统一由最后一步用 Node 调 API 上传。
      # 原因：electron-builder 的 publisher 会在构建过程中逐个上传，
      # 一旦中途失败就会留下「只有 blockmap、没有 exe」的残缺 Release。
      - name: 打包安装版 + 便携版（安装版支持自动更新）
        id: build_all
        continue-on-error: true
        run: npx electron-builder --win --config.npmRebuild=false --publish never

      # 偶发的 NSIS 失败（自解压/解压器被拦截、临时文件占用）重试一次
      - name: 重试打包
        id: build_retry
        if: steps.build_all.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning::首次打包失败，重试一次"
          npx electron-builder --win --config.npmRebuild=false --publish never

      # 仍然失败：至少保证便携版能发布出去，不让整次发布落空
      - name: 兜底：仅打包便携版
        id: build_portable
        if: steps.build_all.outcome == 'failure' && steps.build_retry.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning::安装版打包失败，降级为仅发布便携版"
          npx electron-builder --win --config.npmRebuild=false --config.win.target=portable --publish never

      # 绿色版只是「便携版被系统策略拦截时」的兜底方案，失败不应影响正式产物发布
      - name: 构建绿色版目录（兜底方案，允许失败）
        id: green
        if: always()
        continue-on-error: true
        run: node scripts/build-green.mjs

      - name: 压缩绿色版
        if: steps.green.outcome == 'success'
        shell: pwsh
        run: |
          $zip = 'release/ClauseEye-green-win-x64.zip'
          if (Test-Path $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path 'release/ClauseEye-green' -DestinationPath $zip -CompressionLevel Optimal

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClauseEye-windows
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap
          retention-days: 30

      # 同一个 tag 上若残留重复的 Release（资产还各缺一半），只保留资产最全的那条
      - name: 清理重复的 Release
        if: always() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/dedupe-releases.mjs --apply

      # 发布：用 Node 直接调 GitHub REST API（不依赖 runner 上的 gh CLI，失败信息可直接看到）
      - name: 创建 / 更新 Release 并上传产物
        if: always() && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs --dir release

      # 兜底校验：打包全挂时上面的步骤也能跑完，这里显式失败，避免「绿着但没产物」
      - name: 校验发布产物
        if: always() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -Path release -Filter *.exe -ErrorAction SilentlyContinue)
          $installers = @($exes | Where-Object { $_.Name -like '*setup.exe' -and $_.Length -gt 30MB })
          Write-Host "exe 产物：$($exes.Count) 个（其中可用安装版 $($installers.Count) 个）"
          if ($exes.Count -eq 0) {
            Write-Host "::error::没有任何 exe 产物，本次发布失败"
            exit 1
          }
          if ($installers.Count -eq 0) {
            Write-Host "::warning::本次没有可用的安装版（自动更新不可用），只有免安装产物"
          }