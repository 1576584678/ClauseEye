name: Build & Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: '发布为草稿'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    name: 构建 Windows 免安装版
    runs-on: windows-latest
    env:
      # electron-builder 需要下载 electron / nsis / winCodeSign，CI 直连 GitHub 即可
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      # fetch-depth: 0 —— 自动生成「本次更新」需要能读到上一个 tag 到当前 tag 的提交
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 缓存 electron / nsis / winCodeSign，避免重复下载造成的偶发失败
      - name: 缓存 electron-builder 工具链
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: eb-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 校验（类型检查 + 单测）
        run: |
          npm run typecheck
          npm test

      - name: 下载离线 OCR 语言包
        run: npm run tessdata
        continue-on-error: true

      - name: 生成图标
        run: npm run icon

      - name: 前端生产构建
        run: npm run build

      # 这里只构建、不发布：产物统一由最后一步用 gh 上传。
      # 原因：electron-builder 的 publisher 会在构建过程中逐个上传，
      # 一旦中途失败就会留下「只有 blockmap、没有 exe」的残缺 Release。
      - name: 打包安装版 + 便携版（安装版支持自动更新）
        id: build_all
        continue-on-error: true
        run: npx electron-builder --win --config.npmRebuild=false --publish never

      # 偶发的 NSIS 失败（自解压/解压器被拦截、临时文件占用）重试一次
      - name: 重试打包
        id: build_retry
        if: steps.build_all.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning::首次打包失败，重试一次"
          npx electron-builder --win --config.npmRebuild=false --publish never

      # 仍然失败：至少保证便携版能发布出去，不让整次发布落空
      - name: 兜底：仅打包便携版
        id: build_portable
        if: steps.build_all.outcome == 'failure' && steps.build_retry.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning::安装版打包失败，降级为仅发布便携版"
          npx electron-builder --win --config.npmRebuild=false --config.win.target=portable --publish never

      # 绿色版只是「便携版被系统策略拦截时」的兜底方案，失败不应影响正式产物发布
      - name: 构建绿色版目录（兜底方案，允许失败）
        id: green
        if: always()
        continue-on-error: true
        run: node scripts/build-green.mjs

      - name: 压缩绿色版
        if: steps.green.outcome == 'success'
        shell: pwsh
        run: |
          $zip = 'release/ClauseEye-green-win-x64.zip'
          if (Test-Path $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path 'release/ClauseEye-green' -DestinationPath $zip -CompressionLevel Optimal

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClauseEye-windows
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap
          retention-days: 30

      # 同一个 tag 上若残留重复的 Release（资产还各缺一半），只保留资产最全的那条
      - name: 清理重复的 Release
        if: always() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/dedupe-releases.mjs --apply

      - name: 创建 / 更新 Release
        if: always() && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<'EOF'
          ## ClauseEye · 契眼（Windows 免安装版）

          下载后**双击即可运行**，不需要安装 Node.js 或任何其它依赖。

          | 文件 | 说明 |
          |---|---|
          | `ClauseEye-*-win-x64-setup.exe` | 安装版（**推荐**）。安装后可在应用内一键自动更新，后续版本无需手动下载 |
          | `ClauseEye-*-portable.exe` | 单文件便携版，双击直接运行；免安装版无法自我更新，新版本会提示你到本页面下载 |
          | `ClauseEye-green-win-x64.zip` | 绿色版目录，解压后双击 `ClauseEye.exe`。如果单文件版提示「应用程序控制策略已阻止此文件」（Windows 11 智能应用控制），请改用这个 |
          | `latest.yml` / `*.blockmap` | 自动更新所需的元数据，**不要删除**（应用靠它判断是否有新版本） |

          **更新机制**：安装版启动 20 秒后（或打开设置页点「检查更新」）会读取本页的 `latest.yml` 判断版本，
          发现新版本会弹系统通知并在应用顶部提示，可一键下载并重启安装；便携版 / 绿色版只做提示，不自动替换文件。

          **V1 内容**：150 条中国法规则库（劳动/租房/Offer/离职/工伤/NDA/服务协议）、系统级到期提醒、系统钥匙串保护主密钥、离线 OCR（扫描件与图片识别，语言包随包分发）。

          数据默认存放在 `%APPDATA%\ClauseEye\`，全部本地加密，应用不连接任何自建服务。
          EOF
          )

          # 自动附上「上一个 tag → 当前 tag」的提交列表，省去手写发布说明
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "${PREV_TAG}" ]; then
            CHANGES=$(git log --no-merges --pretty='- %s' "${PREV_TAG}..${GITHUB_REF_NAME}")
          else
            CHANGES=$(git log --no-merges --pretty='- %s' -20 "${GITHUB_REF_NAME}")
          fi
          if [ -n "${CHANGES}" ]; then
            NOTES="${NOTES}

          ### 本次更新

          ${CHANGES}"
          fi

          # 只提交实际存在的产物，避免绿色版构建失败时 gh 因通配符无匹配而报错
          assets=()
          for f in release/*.exe release/*.zip release/*.yml release/*.blockmap; do
            if [ -e "$f" ]; then assets+=("$f"); fi
          done
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::release/ 下没有任何可发布的产物"
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "ClauseEye ${GITHUB_REF_NAME}" --notes "$NOTES" --latest
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "ClauseEye ${GITHUB_REF_NAME}" \
              --notes "$NOTES" \
              ${{ inputs.draft && '--draft' || '' }}
          fi

          # 大文件上传偶发中断，重试三次
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber; then
              break
            fi
            echo "::warning::第 ${attempt} 次上传 Release 资产失败"
            attempt=$((attempt + 1))
            sleep 10
          done
          if [ "$attempt" -gt 3 ]; then
            echo "::error::Release 资产上传失败"
            exit 1
          fi

          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"

      # 兜底校验：打包全挂时上面的步骤也能跑完，这里显式失败，避免「绿着但没产物」
      - name: 校验发布产物
        if: always() && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          count=$(ls release/*.exe 2>/dev/null | wc -l)
          installers=$(ls release/*setup.exe 2>/dev/null | wc -l)
          echo "exe 产物数量：${count}（其中安装版 ${installers} 个）"
          if [ "${count}" -eq 0 ]; then
            echo "::error::没有任何 exe 产物，本次发布失败"
            exit 1
          fi
          if [ "${installers}" -eq 0 ]; then
            echo "::warning::本次没有安装版（因此自动更新不可用），只有免安装产物"
          fi